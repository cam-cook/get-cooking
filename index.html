<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Get cooking — Cook onboarding prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F4F4; --surface:#FFFFFF; --sunk:#F2F2F2; --sunk2:#E5E5E5;
  --ink:#1E1E1E; --muted:#595959; --line:#D4D4D4; --line2:#8C8C8C;
  --strong:#2B2B2B; --on-strong:#FFFFFF; --frame:#1E1E1E; --proto:#FFF7D6; --proto-line:#B08A00; --proto-ink:#4A3A00;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121212; --surface:#1C1C1C; --sunk:#262626; --sunk2:#333333;
    --ink:#EDEDED; --muted:#B3B3B3; --line:#3A3A3A; --line2:#7A7A7A;
    --strong:#EDEDED; --on-strong:#121212; --frame:#7A7A7A; --proto:#2E2A14; --proto-line:#8A7420; --proto-ink:#F0E2A8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121212; --surface:#1C1C1C; --sunk:#262626; --sunk2:#333333;
  --ink:#EDEDED; --muted:#B3B3B3; --line:#3A3A3A; --line2:#7A7A7A;
  --strong:#EDEDED; --on-strong:#121212; --frame:#7A7A7A; --proto:#2E2A14; --proto-line:#8A7420; --proto-ink:#F0E2A8;
  color-scheme: dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--ink)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* prototype bar */
.proto{background:var(--proto);border-bottom:1px dashed var(--proto-line);color:var(--proto-ink);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font-size:13px}
.proto strong{font-weight:600}
.proto label{display:flex;gap:6px;align-items:center}
.proto select,.proto button{background:transparent;border:1px solid var(--proto-line);border-radius:6px;padding:5px 10px;color:var(--proto-ink);cursor:pointer;min-height:32px}
.proto .sp{flex:1}

/* app shell */
.app{display:flex;flex-wrap:wrap;min-height:calc(100vh - 54px)}
.nav{flex:1 1 200px;max-width:240px;background:var(--surface);border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:4px}
.brandmark{font-weight:700;font-size:18px;padding:4px 10px 16px}
.nav button{all:unset;cursor:pointer;padding:10px;border-radius:6px;font-size:14px;display:flex;justify-content:space-between;align-items:center;min-height:24px}
.nav button[aria-current="page"]{background:var(--sunk);font-weight:600}
.nav button:hover{background:var(--sunk)}
.nav button:focus-visible{outline:2px solid var(--ink)}
.main{flex:999 1 560px;min-width:0;padding:32px 24px 64px}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
@media (max-width:760px){.nav{max-width:none;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line);padding:8px}.brandmark{width:100%;padding:4px 10px 6px}.main{padding:20px 14px 48px}}

/* primitives */
h1{margin:0;font-size:28px;font-weight:600;line-height:1.2}
h2{margin:0;font-size:18px;font-weight:600}
h3{margin:0;font-size:15px;font-weight:600}
p{margin:0}
.muted{color:var(--muted);font-size:13px}
.crumb{color:var(--muted);font-size:13px}
.crumb button{all:unset;cursor:pointer;text-decoration:underline}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.pad{padding:20px 24px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.grow{flex:1 1 260px;min-width:0}
.between{justify-content:space-between}
.end{justify-content:flex-end}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:6px;border:1px solid var(--line2);background:var(--surface);cursor:pointer;font-size:14px;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--strong);color:var(--on-strong);border-color:var(--strong);font-weight:500}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line2);white-space:nowrap}
.pill.dark{background:var(--strong);color:var(--on-strong);border-color:var(--strong)}
.pill.dash{border-style:dashed}
.list > *+*{border-top:1px solid var(--line)}
.item{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:16px 24px}
.item.next{background:var(--sunk)}
.num{width:28px;height:28px;border-radius:50%;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.num.done{background:var(--strong);color:var(--on-strong);border-color:var(--strong)}
.bar{height:8px;background:var(--sunk2);border-radius:4px;overflow:hidden;flex:0 1 280px;min-width:120px}
.bar span{display:block;height:100%;background:var(--strong)}
.field{display:flex;flex-direction:column;gap:6px;flex:1 1 220px;min-width:0}
.field label{font-size:13px;font-weight:500}
.input{min-height:44px;padding:10px 12px;border:1px solid var(--line2);border-radius:6px;background:var(--surface);width:100%}
textarea.input{min-height:120px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.check input{width:20px;height:20px;margin:0;flex:none;accent-color:var(--strong)}
.opt{flex:1 1 180px;display:flex;gap:10px;align-items:center;border:1px solid var(--line2);border-radius:6px;padding:12px;cursor:pointer;min-height:44px}
.opt:has(input:checked){border:2px solid var(--ink);padding:11px}
.opt input{accent-color:var(--strong);width:18px;height:18px;margin:0}
.ph{background:var(--sunk2);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;text-align:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:6px}
.tile:focus-visible{outline:2px solid var(--ink)}
.tile .muted{font-size:12px}
.banner{border:1px solid var(--line2);border-radius:8px;padding:16px 20px;background:var(--sunk);display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.vcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal{background:var(--surface);border-radius:10px;max-width:600px;width:100%;max-height:90vh;overflow:auto;padding:28px;display:flex;flex-direction:column;gap:18px}
.x{min-width:44px;min-height:44px;border:1px solid var(--line2);border-radius:6px;background:var(--surface);cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--strong);color:var(--on-strong);padding:12px 18px;border-radius:8px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.ext{border:2px dashed var(--line2);border-radius:10px;padding:28px;background:var(--surface);display:flex;flex-direction:column;gap:16px;max-width:520px;margin:40px auto}
.shop{border:2px solid var(--frame);border-radius:8px;overflow:hidden;background:var(--surface)}
.shop .hd{background:var(--sunk2);padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.done-mark{font-size:40px;line-height:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function(){
const KEY='get-cooking-proto-v1';
const fresh=()=>({
  screen:'signup', order:'admin', gov:false, welcomeSeen:false,
  first:'Sam', business:'Sam’s Kitchen', address:'12 Example St, Footscray VIC 3011', sameKitchen:true,
  general:false,
  docs:{fbr:'required',fss:'required',pl:'required',wc:'required'},
  decl:false, care:false,
  stripe:'none', invoice:false,
  logo:false, square:false, colours:false,
  recipes:0, fulfilment:null, about:false, menu:'none',
  csNotified:false, modal:null, toast:null, from:null
});
let S;
try{ S=JSON.parse(localStorage.getItem(KEY))||fresh(); }catch(e){ S=fresh(); }
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} };

const DOCS=[['fbr','Food business registration'],['fss','Food safety supervisor certificate'],['pl','Public liability certificate of currency'],['wc','Workers compensation certificate of currency']];

// ---- derived state
const docsSubmitted=()=>Object.values(S.docs).every(v=>v==='review'||v==='approved');
const docsApproved=()=>Object.values(S.docs).every(v=>v==='approved');
const complianceCount=()=>Object.values(S.docs).filter(v=>v!=='required'&&v!=='rejected').length+(S.decl?1:0);
const st={
  general:()=>S.general,
  compliance:()=>docsSubmitted()&&S.decl,
  payments:()=>S.stripe==='connected',
  brand:()=>S.logo&&S.square&&S.colours,
  invoice:()=>S.invoice,
  recipe:()=>S.recipes>0,
  fulfilment:()=>!!S.fulfilment,
  about:()=>S.about,
  menu:()=>S.menu!=='none'
};
const brandCount=()=>[S.logo,S.square,S.colours].filter(Boolean).length;
const requiredKeys=()=>['general','compliance','payments','brand'];
const requiredDone=()=>requiredKeys().filter(k=>st[k]()).length;

function blockers(){
  const b=[];
  if(!S.general) b.push(['General details','ABN and business address needed','general','Open General details']);
  const missing=Object.values(S.docs).filter(v=>v==='required'||v==='rejected').length+(S.decl?0:1);
  if(missing) b.push(['Compliance',missing+' item'+(missing>1?'s':'')+' still to submit','compliance','Open Compliance']);
  else if(!docsApproved()) b.push(['Compliance','Documents in review with Customer Success. Usually 1 business day.','compliance','View status']);
  if(S.stripe!=='connected') b.push(['Stripe payments',S.stripe==='incomplete'?'Stripe setup not finished':'Not connected. Customers can’t pay online.','payments','Connect Stripe']);
  if(!st.brand()) b.push(['Brand kit',(3-brandCount())+' of 3 items missing. Emails can’t send without the square logo.','brand','Open Brand kit']);
  if(!S.about) b.push(['About page','Empty. Customers see it before ordering.','about','Write About page']);
  if(!S.fulfilment) b.push(['Delivery or pickup','No way for customers to receive orders yet','fulfilment','Set up fulfilment']);
  if(!S.recipes) b.push(['Recipes','The menu has no recipes','recipe','Create recipe']);
  return b;
}
function ready(){
  const r=[];
  if(S.general) r.push('General details'); if(docsApproved()&&S.decl) r.push('Compliance'); if(S.stripe==='connected') r.push('Stripe payments');
  if(st.brand()) r.push('Brand kit'); if(S.about) r.push('About page'); if(S.fulfilment) r.push(S.fulfilment==='pickup'?'Pickup from kitchen':'Delivery zones');
  if(S.recipes) r.push(S.recipes+' recipe'+(S.recipes>1?'s':''));
  return r;
}

// ---- actions
const go=(screen)=>{ if(S.screen==='home'||S.screen==='settings') S.from=null; S.screen=screen; S.modal=null; window.scrollTo(0,0); render(); };
function toast(msg){ S.toast=msg; render(); clearTimeout(toast.t); toast.t=setTimeout(()=>{S.toast=null;render();},3200); }
function checkCS(){
  if(!S.csNotified && requiredDone()===4){ S.csNotified=true; setTimeout(()=>toast('All required steps complete. Customer Success has been notified.'),50); }
}
const A={
  'go':el=>go(el.dataset.to),
  'proto-order':el=>{S.order=el.value;render();},
  'proto-reset':()=>{ if(confirm('Reset the prototype to a brand-new Cook?')){ S=fresh(); save(); render(); } },
  'proto-approve':()=>{ Object.keys(S.docs).forEach(k=>{ if(S.docs[k]==='review') S.docs[k]='approved'; }); toast('Customer Success approved the submitted documents.'); },
  'proto-reject':()=>{ const k=Object.keys(S.docs).find(k=>S.docs[k]==='review'); if(k){ S.docs[k]='rejected'; toast('Customer Success returned 1 document.'); } else toast('No documents in review to return.'); },
  'proto-skip':()=>{ Object.assign(S,{general:true,decl:true,stripe:'connected',logo:true,square:true,colours:true}); Object.keys(S.docs).forEach(k=>S.docs[k]='approved'); S.welcomeSeen=true; checkCS(); render(); },
  'signup':()=>{
    const f=document.getElementById('fn').value.trim(), b=document.getElementById('bn').value.trim(), a=document.getElementById('ba').value.trim();
    if(f) S.first=f; if(b) S.business=b; if(a) S.address=a;
    S.sameKitchen=document.getElementById('same').checked;
    S.gov=document.querySelector('input[name=gov]:checked').value==='yes';
    S.general=!!(document.getElementById('abn').value.trim()&&S.address);
    go('home');
  },
  'welcome':()=>{ S.welcomeSeen=true; render(); },
  'save-general':()=>{ S.general=true; checkCS(); toast('General details saved'); go('home'); },
  'upload':el=>{ S.docs[el.dataset.doc]='review'; checkCS(); render(); },
  'sign-decl':()=>{ if(!document.getElementById('declok').checked){ toast('Tick the declaration to sign it'); return; } S.decl=true; checkCS(); render(); },
  'sign-care':()=>{ S.care=true; toast('Care declaration signed'); render(); },
  'stripe-go':()=>go('stripe'),
  'stripe-done':()=>{ S.stripe='connected'; checkCS(); go('payments'); },
  'stripe-leave':()=>{ S.stripe='incomplete'; go('payments'); },
  'save-invoice':()=>{ S.invoice=true; toast('Bank details saved'); render(); },
  'logo':()=>{ S.logo=true; render(); },
  'square':()=>{ if(!S.logo){ toast('Upload the logo first'); return; } S.square=true; checkCS(); render(); },
  'colours':()=>{ if(!S.logo){ toast('Upload the logo first'); return; } S.colours=true; checkCS(); render(); },
  'save-brand':()=>{ toast(st.brand()?'Brand kit saved':'Brand kit saved. '+(3-brandCount())+' items still needed.'); go('home'); },
  'gov-toggle':()=>{ S.gov=!S.gov; render(); },
  'save-recipe':()=>{ S.recipes++; toast('Recipe saved'); go(S.from||'home'); },
  'pickup':()=>{ S.fulfilment='pickup'; toast('Pickup from kitchen added'); go(S.from||'home'); },
  'delivery':()=>{ S.fulfilment='delivery'; toast('Delivery zones added'); go(S.from||'home'); },
  'save-about':()=>{ S.about=true; toast('About page saved'); go(S.from||'home'); },
  'menu-new':()=>{ if(S.menu==='none') S.menu='draft'; S.from='menu'; go('menu'); },
  'publish':()=>{ if(blockers().length){ S.modal='blocked'; render(); } else { go('preview'); } },
  'publish-confirm':()=>{ S.menu='live'; go('launched'); },
  'close-modal':()=>{ S.modal=null; render(); },
  'from-menu':el=>{ S.from='menu'; go(el.dataset.to); },
  'nope':()=>toast('Not part of this prototype')
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]'); if(!el) return;
  if(el.tagName==='SELECT') return;
  e.preventDefault(); A[el.dataset.a]&&A[el.dataset.a](el); save();
});
document.addEventListener('change',e=>{
  const el=e.target.closest('select[data-a]'); if(el){ A[el.dataset.a](el); save(); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&S.modal){ S.modal=null; render(); } });

// ---- helpers
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const btn=(label,a,o={})=>`<button class="btn${o.pri?' pri':''}${o.sm?' sm':''}" data-a="${a}"${o.to?` data-to="${o.to}"`:''}${o.doc?` data-doc="${o.doc}"`:''}${o.dis?' disabled':''}>${label}</button>`;
const goBtn=(label,to,o={})=>btn(label,'go',{...o,to});
const pill=(t,dark,dash)=>`<span class="pill${dark?' dark':''}${dash?' dash':''}">${t}</span>`;
const crumb=(label)=>`<div class="crumb"><button data-a="go" data-to="settings">Settings</button> / ${label}</div>`;
const backHome=()=>S.from==='menu'?goBtn('Back to menu','menu'):goBtn('Back to checklist','home');

// ---- screens
function vSignup(){
  return `<div class="wrap" style="max-width:640px">
  <div class="stack"><span class="muted">Cookaborough</span><h1>Create a Cook account</h1><p class="muted" style="font-size:15px">Business details entered here fill in Settings automatically.</p></div>
  <div class="card pad stack"><h2>Account</h2>
    <div class="row"><div class="field"><label for="fn">First name</label><input id="fn" class="input" value="${esc(S.first)}"></div><div class="field"><label for="ln">Last name</label><input id="ln" class="input"></div></div>
    <div class="row"><div class="field"><label for="em">Email</label><input id="em" type="email" class="input"></div><div class="field"><label for="pw">Password</label><input id="pw" type="password" class="input"></div></div>
  </div>
  <div class="card pad stack"><h2>Business</h2>
    <div class="field"><label for="abn">ABN</label><div class="row"><input id="abn" class="input grow" value="70 628 305 751" inputmode="numeric"><button class="btn" data-a="nope">Look up</button></div>
      <div style="background:var(--sunk);border-radius:6px;padding:10px 12px"><strong style="font-size:13px">[REGISTERED ENTITY NAME]</strong><div class="muted">Registered for GST. Active.</div></div></div>
    <div class="field"><label for="bn">Business name</label><span class="muted">The trading name customers see</span><input id="bn" class="input" value="${esc(S.business)}"></div>
    <div class="field"><label for="ba">Business address</label><input id="ba" class="input" value="${esc(S.address)}"></div>
    <label class="check"><input id="same" type="checkbox"${S.sameKitchen?' checked':''}><span><span>Meals are prepared at this address</span><br><span class="muted">Sets the kitchen address and a pickup location</span></span></label>
  </div>
  <div class="card pad stack"><h2>Customers</h2><p class="muted">Supply meals to Support at Home or NDIS customers?</p>
    <div class="row"><label class="opt"><input type="radio" name="gov" value="yes"${S.gov?' checked':''}>Yes</label><label class="opt"><input type="radio" name="gov" value="no"${S.gov?'':' checked'}>No, not yet</label></div>
    <span class="muted">Can be changed later in Settings › Government programs</span></div>
  ${btn('Create account','signup',{pri:1})}
  </div>`;
}

function rowItem(key,i,title,desc,status,statusDark,label,to,isNext,extraPill){
  const done=st[key]();
  return `<div class="item${isNext?' next':''}">
    <span class="num${done?' done':''}" aria-hidden="true">${done?'✓':i}</span>
    <div class="grow"><div class="row" style="gap:8px"><h3>${title}</h3>${extraPill||''}</div><p class="muted">${desc}</p></div>
    ${pill(status,statusDark)}
    ${goBtn(done?'Edit':label,to,{pri:isNext&&!done})}
  </div>`;
}
function vHome(){
  const req=[
    ['general','General details','ABN, business and kitchen address, public contact details',S.general?'Completed':'Not started',S.general,'Start','general'],
    ['compliance','Compliance','4 documents and a declaration. Usually 5–10 minutes with documents to hand.',st.compliance()?(docsApproved()?'Approved':'In review'):complianceCount()+' of 5',st.compliance(),'Start','compliance'],
    ['payments','Payments','Connect Stripe to receive online payments',S.stripe==='connected'?'Connected':S.stripe==='incomplete'?'Not finished':'Not connected',S.stripe==='connected','Connect','payments'],
    ['brand','Brand kit','Logo, square logo for emails and labels, brand colours',st.brand()?'Completed':brandCount()+' of 3',st.brand(),'Start','brand']
  ];
  if(S.gov) req.push(['invoice','Invoice payments','Bank details for Support at Home and NDIS invoices',S.invoice?'Completed':'Not started',S.invoice,'Add details','gov']);
  const cook=[
    ['recipe','Add the first recipe','Ingredients, allergens and nutrition for labels and compliance',S.recipes?S.recipes+' added':'Not started',S.recipes>0,'Create recipe','recipe','2 min'],
    ['fulfilment','Set up delivery or pickup','Pickup from the kitchen is 1 click. Delivery zones take longer.',S.fulfilment?'Completed':'Not started',!!S.fulfilment,'Set up','fulfilment','2 min'],
    ['about','Write the About page','The business story customers read before ordering',S.about?'Completed':'Not started',S.about,'Write','about','1 min'],
    ['menu','Build the first menu','Add recipes, set open and close times, then publish',S.menu==='live'?'Live':S.menu==='draft'?'Draft':'Not started',S.menu!=='none','Create menu','menu','2 min']
  ];
  const reqFirst=S.order==='admin';
  const firstSec=reqFirst?req:cook, nextKey=(firstSec.find(r=>!st[r[0]]())||(reqFirst?cook:req).find(r=>!st[r[0]]())||[])[0];
  const reqHtml=`<section class="card" aria-labelledby="h-req"><div class="pad stack" style="gap:4px"><div class="row" style="gap:10px"><h2 id="h-req">${reqFirst?'Required to trade':'Before the first menu can publish'}</h2><span class="muted">About 20 minutes</span></div><p class="muted">Legal, payment and brand details. Each step returns here when saved.</p></div>
    <div class="list" style="border-top:1px solid var(--line)">${req.map((r,i)=>rowItem(r[0],r[0]==='invoice'?'+':i+1,r[1],r[2],r[3],r[4],r[5],r[6],r[0]===nextKey,r[0]==='invoice'?pill('Support at Home and NDIS',true):'')).join('')}</div></section>`;
  const cookHtml=`<section class="card" aria-labelledby="h-cook"><div class="pad stack" style="gap:4px"><h2 id="h-cook">Get cooking</h2><p class="muted">${reqFirst?'The 4 things every menu needs. Each has a short introduction video.':'Start with the food. Nothing goes live until the menu is published.'}</p></div>

   <section class="banner" style="flex-direction:column;align-items:stretch"><div class="row between"><div><h2>Required to trade</h2><p class="muted">${requiredDone()} of 4 complete</p></div>${goBtn('View checklist on Home','home')}</div>
    <div class="tiles">${t('General details','ABN, addresses, contact details','general',S.general?'Completed':'Not started',S.general)}${t('Compliance','Documents and declaration','compliance',st.compliance()?(docsApproved()?'Approved':'In review'):complianceCount()+' of 5',st.compliance())}${t('Stripe payments','Online card payments','payments',S.stripe==='connected'?'Connected':'Not connected',S.stripe==='connected')}${t('Brand kit','Logos and colours','brand',st.brand()?'Completed':brandCount()+' of 3',st.brand())}</div></section>
   <h2>Delivery and pickup</h2><div class="tiles">${t('Delivery and pickup','Zones, schedules, pickup locations','fulfilment',S.fulfilment?'Set up':null)}${t('Closures and public holidays','Dates when fulfilment is unavailable')}${t('Checkout add-ons','Ice packs')}</div>
   <h2>Operations</h2><div class="tiles">${t('Government programs','Support at Home and NDIS','gov',S.gov?'On':'Off',S.gov)}${t('Fees','All order fees in 1 place')}${t('Find a Cook','Directory listing')}${t('Customer notifications','Automated customer emails')}</div></div>`;
}

const VIEWS={signup:vSignup,home:vHome,general:vGeneral,compliance:vCompliance,payments:vPayments,stripe:vStripe,brand:vBrand,gov:vGov,recipe:vRecipe,fulfilment:vFulfil,about:vAbout,menu:vMenu,preview:vPreview,launched:vLaunched,settings:vSettings};
const NAV=[['home','Home'],['menu','Menus'],['recipe','Recipes'],['about','Shopfront'],['settings','Settings']];
function navCurrent(){ const s=S.screen; if(['general','compliance','payments','brand','gov','fulfilment','settings'].includes(s)) return 'settings'; if(s==='preview'||s==='launched') return 'menu'; return s; }

function render(){
  const root=document.getElementById('root');
  const proto=`<div class="proto" role="region" aria-label="Prototype controls"><strong>Prototype</strong>
   <label>Order <select data-a="proto-order" aria-label="Checklist order"><option value="admin"${S.order==='admin'?' selected':''}>Admin first</option><option value="build"${S.order==='build'?' selected':''}>Build first</option></select></label>
   <button data-a="proto-approve">CS approves documents</button><button data-a="proto-reject">CS returns a document</button><button data-a="proto-skip">Skip required steps</button>
   <span class="sp"></span><button data-a="proto-reset">Reset to new Cook</button></div>`;
  let body;
  if(S.screen==='signup'||S.screen==='stripe'){ body=`<main class="main">${VIEWS[S.screen]()}</main>`; }
  else {
    const cur=navCurrent();
    body=`<div class="app"><nav class="nav" aria-label="Main"><div class="brandmark">Cookaborough</div>${NAV.map(([k,l])=>`<button ${k==='menu'?'data-a="menu-new"':'data-a="go" data-to="'+k+'"'}${cur===k?' aria-current="page"':''}>${l}${k==='home'&&requiredDone()<4?`<span class="pill" style="font-size:11px;padding:1px 7px">${requiredDone()}/4</span>`:''}</button>`).join('')}</nav><main class="main">${(VIEWS[S.screen]||vHome)()}</main></div>`;
  }
  let overlay='';
  if(S.screen==='home'&&!S.welcomeSeen) overlay=vWelcome();
  if(S.modal==='blocked') overlay=vBlocked();
  root.innerHTML=proto+body+overlay+(S.toast?`<div class="toast" role="status">${esc(S.toast)}</div>`:'');
  const m=root.querySelector('.modal button.btn.pri, .modal .x'); if(overlay&&m) m.focus();
  save();
}
render();
})();
</script>
</body>
</html>
